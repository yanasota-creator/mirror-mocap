# Runs every check (tools/test_all.py) on each push and pull request.
# A red ✗ on GitHub means something to fix: often "index.html is out of date" (run python tools/build.py and commit).
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the libraries the page loads, and a browser
        working-directory: tools/webtest
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: ffmpeg for a fake camera video, mono for the Unity compile check; the video from MediaPipe's sample photo
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg mono-mcs
          curl -sfL -o portrait.jpg https://storage.googleapis.com/mediapipe-assets/portrait.jpg
          ffmpeg -loglevel error -loop 1 -i portrait.jpg -vf "scale=-2:720,pad=1280:720:(ow-iw)/2:0,format=yuv420p" -t 2 -r 15 cam.y4m
      - name: Run all checks
        run: python tools/test_all.py --a11y --cam cam.y4m
      - name: The libraries on jsDelivr match the fingerprints in the page
        run: python tools/build.py --check-cdn
